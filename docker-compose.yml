services:
  stage1-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rough_cut_stage1_api
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./projects:/app/projects
      - ./data:/app/data
    command: gunicorn -b 0.0.0.0:8000 --workers 1 --timeout 600 api:app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
