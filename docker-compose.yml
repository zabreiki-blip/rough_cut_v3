services:
  stage1-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
      - SYNC_WHISPER_BACKEND=faster-whisper
      - SYNC_WHISPER_MODEL=${SYNC_WHISPER_MODEL:-medium}
      - SYNC_WHISPER_DEVICE=${SYNC_WHISPER_DOCKER_DEVICE:-cpu}
      - SYNC_WHISPER_COMPUTE_TYPE=${SYNC_WHISPER_DOCKER_COMPUTE_TYPE:-int8}
      - SYNC_WHISPER_CPU_THREADS=${SYNC_WHISPER_CPU_THREADS:-8}
      - SYNC_WHISPER_TIMEOUT_SECONDS=${SYNC_WHISPER_TIMEOUT_SECONDS:-14400}
      - SYNC_AUDIO_MAX_BYTES=${SYNC_AUDIO_MAX_BYTES:-4294967296}
      - HF_HOME=/app/.cache/huggingface
      - ROUGH_CUT_CEP_CORS=1
      # XMEML is imported by Premiere on the macOS host, so exported file URLs
      # must use the host checkout path rather than /app inside the container.
      - ROUGH_CUT_HOST_PROJECTS_ROOT=${PWD}/projects
    # Resource ceiling for one Whisper-heavy container. Memory: Whisper medium
    # int8 on CPU needs about 2-3 GB, the rest covers ffmpeg, audio/WAV
    # buffers, gunicorn threads and the page cache for bind mounts.
    # CPUs: 0 = no limit. Any other value must not exceed the number of CPUs
    # available to Docker (Docker Desktop: Settings > Resources), otherwise the
    # container fails to start ("range of CPUs is from 0.01 to N").
    # SYNC_WHISPER_CPU_THREADS (default 8) is a separate setting.
    mem_limit: ${ROUGH_CUT_MEM_LIMIT:-8g}
    cpus: ${ROUGH_CUT_CPUS:-0}
    ports:
      - "${ROUGH_CUT_BIND:-127.0.0.1}:${ROUGH_CUT_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./projects:/app/projects
      - ./data:/app/data
      - whisper_cache:/app/.cache/huggingface
    # Single worker by design: see Dockerfile comment above the same
    # gunicorn command for why --workers must stay 1 without an added
    # inter-process lock.
    command: gunicorn -b 0.0.0.0:8000 --workers 1 --threads 4 --timeout 3600 --no-control-socket api:app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  whisper_cache:
