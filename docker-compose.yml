services:
  stage1-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
      - SYNC_WHISPER_BACKEND=faster-whisper
      - SYNC_WHISPER_MODEL=${SYNC_WHISPER_MODEL:-medium}
      - SYNC_WHISPER_DEVICE=${SYNC_WHISPER_DOCKER_DEVICE:-cpu}
      - SYNC_WHISPER_COMPUTE_TYPE=${SYNC_WHISPER_DOCKER_COMPUTE_TYPE:-int8}
      - SYNC_WHISPER_TIMEOUT_SECONDS=${SYNC_WHISPER_TIMEOUT_SECONDS:-14400}
      - SYNC_AUDIO_MAX_BYTES=${SYNC_AUDIO_MAX_BYTES:-4294967296}
      - HF_HOME=/app/.cache/huggingface
      - ROUGH_CUT_CEP_CORS=1
    ports:
      - "${ROUGH_CUT_BIND:-127.0.0.1}:${ROUGH_CUT_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./projects:/app/projects
      - ./data:/app/data
      - whisper_cache:/app/.cache/huggingface
    command: gunicorn -b 0.0.0.0:8000 --workers 1 --threads 4 --timeout 3600 api:app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  whisper_cache:
