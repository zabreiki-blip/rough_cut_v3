name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep in sync with the gitleaks rev in .pre-commit-config.yaml.
          GITLEAKS_VERSION: 8.21.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Python tests
        run: python -m pytest -q --cov=src --cov-report=term-missing --cov-report=xml

      - name: Python compile check
        run: python -m compileall -q src tests

      - name: Ruff correctness checks
        run: ruff check src tests

      - name: Ruff formatting check
        run: ruff format --check src tests

      - name: Mypy type check (baseline clean, type regressions block CI)
        run: mypy src

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install JS dev dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint cep tests --ext .js,.jsx,.cjs

      - name: CEP behavior test
        run: node tests/cep_behavior_test.cjs

      - name: Stage 1 UI behavior test
        run: node tests/stage1_behavior_test.cjs

      - name: Docker Compose config
        run: |
          cp .env.example .env
          docker compose config --quiet

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
