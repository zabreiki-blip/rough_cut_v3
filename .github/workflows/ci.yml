name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Python tests
        run: python -m pytest -q --cov=src --cov-report=term-missing --cov-report=xml

      - name: Python compile check
        run: python -m compileall -q src tests

      - name: Ruff correctness checks
        run: ruff check src tests

      - name: Mypy type check (non-blocking, gradual rollout)
        run: mypy src || true

      - name: CEP behavior test
        run: node tests/cep_behavior_test.cjs

      - name: Docker Compose config
        run: |
          cp .env.example .env
          docker compose config --quiet
