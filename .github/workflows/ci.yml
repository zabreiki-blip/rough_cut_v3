name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-whisper.txt

      - name: Install production ASR dependencies
        run: python -m pip install -r requirements.txt -r requirements-whisper.txt

      - name: Import production ASR without loading a model
        env:
          HF_HUB_OFFLINE: "1"
          SYNC_WHISPER_BACKEND: faster-whisper
        run: python tests/runtime_import_smoke.py

      - name: Build production Docker image
        run: docker build .

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-whisper.txt

      # Runtime dependencies only (what the Docker image ships). The lock file
      # also contains dev tooling, so it is deliberately not audited here.
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit runtime dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt -r requirements-whisper.txt

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Python tests
        run: python -m pytest -q --cov=src --cov-report=term-missing --cov-report=xml

      - name: Python compile check
        run: python -m compileall -q src tests

      - name: Ruff correctness checks
        run: ruff check src tests

      - name: Ruff formatting check
        run: ruff format --check src tests

      - name: Mypy type check (baseline clean, type regressions block CI)
        run: mypy src

      # Node 24 is the current Active LTS (Node 20 is EOL); eslint 8.57.1
      # supports ^12.22 || ^14.17 || >=16, and the JS tests are run on Node 24.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install JS dev dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint cep tests/cep_behavior_test.cjs

      - name: CEP behavior test
        run: node tests/cep_behavior_test.cjs

      - name: Stage 1 UI behavior test
        run: node tests/stage1_behavior_test.cjs

      - name: Docker Compose config
        run: |
          cp .env.example .env
          docker compose config --quiet
