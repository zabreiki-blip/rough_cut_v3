[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 75.0

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["projects", "data", ".venv", ".venv-macos-arm64"]

[tool.ruff.lint]
# Start with correctness rules. Style/formatting can be enabled incrementally
# without burying functional changes in a repository-wide rewrite.
select = ["E9", "F63", "F7", "F82"]
