[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 79.0

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["projects", "data", ".venv", ".venv-macos-arm64"]

[tool.ruff.lint]
# Start with correctness rules. Style/formatting can be enabled incrementally
# without burying functional changes in a repository-wide rewrite.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# src/api.py intentionally imports many stage-module functions/classes it
# does not call by their unqualified name in this file: tests patch them via
# `patch.object(api, "name", ...)`/`monkeypatch.setattr(api, "name", ...)`
# (see tests/test_stage2_sync_api.py, tests/test_normalization_api.py, etc.).
# Removing these "unused" imports would silently break that dependency-
# injection pattern, so F401 is not actionable here.
"src/api.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
# Type checking baseline is clean (mypy src passes with no issues).
# CI step is blocking: any type regressions must be fixed or explicitly
# ignored per-module before merging.
