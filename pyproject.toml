[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 75.0

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["projects", "data", ".venv", ".venv-macos-arm64"]

[tool.ruff.lint]
# Start with correctness rules. Style/formatting can be enabled incrementally
# without burying functional changes in a repository-wide rewrite.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
# Gradual rollout (AUDIT_REVIEW_2026-08-15.md P3): mypy currently reports
# ~44 pre-existing errors across the codebase. The CI step runs
# non-blocking until those are triaged and fixed file by file; do not
# flip it to blocking until `mypy src` is clean or explicit per-module
# ignores are in place.
